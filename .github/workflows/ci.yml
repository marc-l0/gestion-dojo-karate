name: CI

# Se ejecuta en cada Pull Request y cada vez que se actualizan las ramas principales de Gitflow.
on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome (formato y lint)
        run: pnpm ci:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests unitarios
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: Tests e2e del api
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compilar el paquete compartido
        run: pnpm turbo run build --filter=@dojo/shared

      # No usa Google Sheets: el e2e solo comprueba que la API arranca y responde.
      - name: Tests e2e
        run: pnpm --filter api test:e2e
        env:
        JWT_SECRET: secreto-solo-para-ci-con-mas-de-32-caracteres
        ADMIN_USUARIO: admin
        ADMIN_PASSWORD: clave-solo-para-ci-123
        GOOGLE_SPREADSHEET_ID: id-falso-solo-para-ci
